
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RFI Inspector Registration</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 25px 15px;
      background: #f5f5f5;
    }

    .container {
      background: white;
      padding: 25px;
      border-radius: 12px;
      max-width: 400px;
      margin: auto;
    }

    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 14px;
      margin: 15px 0;
      font-size: 16px;
      border-radius: 8px;
    }

    input {
      border: 1px solid #ccc;
    }

    button {
      background: #06c755;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
    }

    #status {
      margin-top: 20px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
<div class="container">

  <h2>RFI Inspector</h2>

  <p>ลงทะเบียน LINE เพื่อรับการแจ้งเตือนงานตรวจสอบ</p>

  <input
    type="text"
    id="registerCode"
    placeholder="กรอก Registration Code"
    autocomplete="off"
  >

  <button id="registerButton" onclick="registerLINE()">
    ลงทะเบียน LINE
  </button>

  <div id="status">กรุณากรอกรหัสลงทะเบียน</div>

</div>

<script>
const LIFF_ID = "2012539357-Su5OjDcV";

const GAS_URL =
  "https://script.google.com/macros/s/AKfycbxEUBQBW5a8OBQEkzJ8sejgsermjnMjxM8PqNabIE_1bBEdM8Ahgw7KtrWZzNnBDjj-vg/exec";

async function registerLINE() {

  const status = document.getElementById("status");
  const button = document.getElementById("registerButton");
  const registerCode =
    document.getElementById("registerCode").value.trim();

  if (!registerCode) {
    status.innerText = "กรุณากรอก Registration Code";
    return;
  }

  button.disabled = true;

  try {

    status.innerText = "กำลังเชื่อมต่อ LINE...";

    await liff.init({
      liffId: LIFF_ID
    });

    if (!liff.isLoggedIn()) {

      sessionStorage.setItem("RFI_RegisterCode", registerCode);

      liff.login({
        redirectUri: window.location.href
      });

      return;
    }

    status.innerText = "กำลังอ่านข้อมูล LINE...";

    const profile = await liff.getProfile();

    status.innerText =
      "กำลังบันทึกข้อมูล Inspector...";

    const result = await callGoogleScript(
      profile.userId,
      profile.displayName,
      registerCode
    );

    if (result.success) {

      status.innerText = result.message;

      document.getElementById("registerCode").value = "";

      sessionStorage.removeItem("RFI_RegisterCode");

    } else {

      throw new Error(result.message);
    }

  } catch (error) {

    status.innerText =
      "ลงทะเบียนไม่สำเร็จ\n" + error.message;

  } finally {

    button.disabled = false;
  }
}

function callGoogleScript(userId, displayName, registerCode) {

  return new Promise((resolve, reject) => {

    const callbackName =
      "rfiCallback_" + Date.now();

    const script = document.createElement("script");

    const params = new URLSearchParams({
      action: "register",
      callback: callbackName,
      userId: userId,
      displayName: displayName,
      registerCode: registerCode
    });

    const timeout = setTimeout(() => {

      cleanup();

      reject(new Error(
        "Google Apps Script ไม่ตอบกลับภายใน 30 วินาที"
      ));

    }, 30000);

    function cleanup() {

      clearTimeout(timeout);

      delete window[callbackName];

      script.remove();
    }

    window[callbackName] = function(result) {

      cleanup();

      resolve(result);
    };

    script.onerror = function() {

      cleanup();

      reject(new Error(
        "ไม่สามารถเชื่อมต่อ Google Apps Script ได้"
      ));
    };

    script.src = GAS_URL + "?" + params.toString();

    document.body.appendChild(script);

  });
}

// เรียกคืน Registration Code หลังจาก LINE Login
window.addEventListener("load", function() {

  const savedCode =
    sessionStorage.getItem("RFI_RegisterCode");

  if (savedCode) {
    document.getElementById("registerCode").value =
      savedCode;
  }

});
</script>

</body>
</html>
